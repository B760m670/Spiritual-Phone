name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: >-
          ./gradlew assembleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=0.1.${{ github.run_number }}
          --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spiritual-phone-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # On every branch push, publish a GitHub Release so the in-app updater
      # (which reads /releases/latest) can pull the new build automatically.
      - name: Publish rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          prerelease: false
          make_latest: true
